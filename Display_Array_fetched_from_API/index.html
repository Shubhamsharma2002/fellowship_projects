<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-API Data Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Multi-API Promise Chaining Display</h1>
    
    <!-- Action Button to start the promise chain -->
    <button id="fetch-btn">Start Fetch Sequence</button>

    <!-- Table 1: Posts (API 1) -->
    <div class="table-container">
      <h2>Posts (API 1)</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Body</th>
          </tr>
        </thead>
        <tbody id="posts-tbody">
          <tr><td colspan="3" class="placeholder">Click the button to load data...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Table 2: Products (API 2) -->
    <div class="table-container">
      <h2>Products (API 2)</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Brand</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="4" class="placeholder">Waiting for Posts API...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Table 3: Todos (API 3) -->
    <div class="table-container">
      <h2>Todos (API 3)</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Todo</th>
            <th>Completed</th>
          </tr>
        </thead>
        <tbody id="todos-tbody">
          <tr><td colspan="3" class="placeholder">Waiting for Products API...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
