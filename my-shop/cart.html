<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeShop - Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">MeShop.</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Signup</a>
      <a href="cart.html">My Cart</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <h2 style="padding: 24px 60px 0;">My Cart</h2>
  <div class="cart-layout">
    <div id="cartItems" class="cart-items"></div>

    <div class="cart-summary">
      <h3 style="margin-bottom: 20px;">Checkout List</h3>
      <div id="summaryItems"></div>
      <div class="summary-total">
        <span>Total</span>
        <span id="totalAmount">$0</span>
      </div>
      <button id="checkoutBtn" class="btn-white" style="width: 100%; margin-top: 24px; font-weight: bold;">
        Click To Checkout
      </button>
    </div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="auth.js"></script>
  <script>checkAuth();</script>
  <script src="cart.js"></script>
</body>
</html>
