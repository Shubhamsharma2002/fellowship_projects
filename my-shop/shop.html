<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeShop - Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">MeShop.</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Signup</a>
      <a href="cart.html">My Cart</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <div class="shop-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h4>Colors</h4>
      <label><input type="checkbox" name="color" value="red"> Red</label>
      <label><input type="checkbox" name="color" value="blue"> Blue</label>
      <label><input type="checkbox" name="color" value="green"> Green</label>
      <label><input type="checkbox" name="color" value="black"> Black</label>
      <label><input type="checkbox" name="color" value="white"> White</label>

      <h4>Sizes</h4>
      <label><input type="checkbox" name="size" value="S"> S</label>
      <label><input type="checkbox" name="size" value="M"> M</label>
      <label><input type="checkbox" name="size" value="L"> L</label>
      <label><input type="checkbox" name="size" value="XL"> XL</label>

      <h4>Rating</h4>
      <input type="range" id="ratingRange" min="0" max="5" step="0.5" value="0">
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:4px;">
        <span>0</span><span id="ratingVal">0</span><span>5</span>
      </div>

      <h4>Price Range</h4>
      <label><input type="checkbox" name="price" value="0-25"> $0 to $25</label>
      <label><input type="checkbox" name="price" value="25-50"> $25 to $50</label>
      <label><input type="checkbox" name="price" value="50-100"> $50 to $100</label>
      <label><input type="checkbox" name="price" value="100-9999"> $100 onwards</label>
    </aside>

    <!-- Main Content -->
    <main class="shop-main">
      <input type="text" id="searchInput" class="search-bar" placeholder="Search products by title...">
      
      <div class="filter-tabs">
        <button class="tab-btn active" data-category="all">All</button>
        <button class="tab-btn" data-category="men's clothing">Mens</button>
        <button class="tab-btn" data-category="women's clothing">Womens</button>
        <button class="tab-btn" data-category="jewelery">Jewellery</button>
        <button class="tab-btn" data-category="electronics">Electronics</button>
      </div>

      <div id="productGrid" class="product-grid"></div>
    </main>
  </div>

  <script src="auth.js"></script>
  <script>checkAuth();</script>
  <script src="shop.js"></script>
</body>
</html>
