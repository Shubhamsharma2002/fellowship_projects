<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sports Day Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🏆 Sports Day Event Simulation</h1>
    <p>Open browser console (F12 or Ctrl+Shift+I) to see complete logs, or track the output below.</p>

    <div id="display-board" class="display-board">
      <p class="status">Click "Start Sports Day" to begin the event!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
